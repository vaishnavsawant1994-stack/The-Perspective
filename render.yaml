services:
  - type: web
    name: the-perspective-candidate
    runtime: node
    repo: https://github.com/vaishnavsawant1994-stack/The-Perspective
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: the-perspective-candidate
          property: connectionString
      - key: PERSPECTIVE_REQUIRE_PRODUCTION_CONFIG
        value: 'true'
      - key: PERSPECTIVE_AUTH_BOUNDARY_MODE
        value: sessions
      - key: PERSPECTIVE_PUBLIC_APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_PERSPECTIVE_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_PERSPECTIVE_EDITORIAL_EMAIL
        sync: false
      - key: PERSPECTIVE_AUTH_DATA_KEY
        generateValue: true
      - key: PERSPECTIVE_AUTH_KEY_VERSION
        value: '1'
      - key: PERSPECTIVE_R9_WORKER_TOKEN
        generateValue: true
