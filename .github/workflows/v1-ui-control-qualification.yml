name: V1 UI Control Qualification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-ui-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_v1_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_v1_ui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_v1_ui
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://127.0.0.1:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"
      PERSPECTIVE_AUTH_TEST_BASE_URL: http://127.0.0.1:3100
      PERSPECTIVE_BROWSER_TEAM_EMAIL: v1-ui-team@example.test
      PERSPECTIVE_BROWSER_TEAM_PASSWORD: V1 UI Team Passphrase 2026!
      PERSPECTIVE_BROWSER_CLIENT_EMAIL: v1-ui-client@example.test
      PERSPECTIVE_BROWSER_CLIENT_PASSWORD: V1 UI Client Passphrase 2026!
      PERSPECTIVE_BROWSER_INVITATION_EMAIL: v1-ui-invited@example.test
      PERSPECTIVE_BROWSER_INVITATION_TOKEN: v1-ui-invitation-token-2026-10-10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare database and authenticated fixtures
        run: |
          npm run db:generate
          npm run db:migrate:deploy
          npm run db:seed
          PERSPECTIVE_ALLOW_AUTH_FIXTURE=true npx tsx scripts/authentication/create-r3-browser-fixture.ts
          TOKENS="$(npx tsx scripts/portal/seed-r12-desk-session.ts)"
          {
            echo 'R12_DESK_TOKENS<<EOF'
            echo "$TOKENS"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3100 > /tmp/v1-ui-server.log 2>&1 &
          echo $! > /tmp/v1-ui-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v1-ui-server.log
          exit 1

      - name: Audit all static authenticated UI controls
        run: node scripts/certification/verify-v1-ui-controls.mjs

      - name: Upload control audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-ui-control-evidence
          path: |
            artifacts/v1-ui-controls
            /tmp/v1-ui-server.log
          if-no-files-found: warn
          retention-days: 14
