name: Neon encrypted database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production-database-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PERSPECTIVE_BACKUP_DATABASE_URL: ${{ secrets.PERSPECTIVE_BACKUP_DATABASE_URL }}
      PERSPECTIVE_BACKUP_PASSPHRASE: ${{ secrets.PERSPECTIVE_BACKUP_PASSPHRASE }}
      NEON_BACKUP_ACCESS_KEY_ID: ${{ secrets.NEON_BACKUP_ACCESS_KEY_ID }}
      NEON_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.NEON_BACKUP_SECRET_ACCESS_KEY }}
      NEON_BACKUP_BUCKET: daily-encrypted-database-backups
      AWS_ENDPOINT_URL_S3: https://br-holy-mode-bapzoz2h.storage.c-8.eu-central-1.aws.neon.tech
      AWS_REGION: eu-central-1
      RESTORE_ADMIN_URL: postgresql://perspective:perspective@127.0.0.1:5432/postgres

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backup and restore tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16 gnupg
          python -m pip install --disable-pip-version-check -r scripts/backup/requirements.txt
          pg_dump --version
          gpg --version | head -n 1

      - name: Test 30-day retention selection
        run: python -m unittest discover -s scripts/backup -p 'test_*.py' -v

      - name: Create encrypted backup, verify remote copy, and restore it
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/backup/run-neon-database-backup.sh
