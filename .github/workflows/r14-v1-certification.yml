name: R14 Technical Certification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r14-technical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_r14
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_r14"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r14
      SHADOW_DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r14_shadow
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://localhost:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate and generate Prisma
        run: |
          npm run db:validate
          npm run db:generate

      - name: Create isolated shadow database
        run: psql postgresql://perspective:perspective@localhost:5432/postgres -c "CREATE DATABASE perspective_r14_shadow"

      - name: Apply and verify migrations
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:status
          npm run db:verify
          npm run db:drift

      - name: Run unit tests
        run: npm test

      - name: Seed deterministic inherited fixtures
        env:
          PERSPECTIVE_ALLOW_DEMO_SEED: "true"
        run: |
          npm run db:seed
          npm run db:seed:assert

      - name: Run live PostgreSQL tests
        run: npm run test:db

      - name: Back up and restore the qualification database
        run: node scripts/certification/backup-restore.mjs

      - name: Inventory surface and scan secrets
        run: |
          node scripts/certification/inventory-surface.mjs
          node scripts/certification/scan-secrets.mjs
          node scripts/certification/verify-r14-claims.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Technical marker
        run: node -e "process.stdout.write(JSON.stringify({r14_technical_verified:true,v1_certified:false,production_deployed:false})+'\n')"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_r14_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_r14_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r14_smoke
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://127.0.0.1:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"
      PERSPECTIVE_AUTH_TEST_BASE_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:migrate:deploy

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3100 > /tmp/r14-server.log 2>&1 &
          echo $! > /tmp/r14-server.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/r14-server.log
          exit 1

      - name: Measure qualification responses
        run: node scripts/certification/performance-smoke.mjs

      - name: Qualify the production server
        run: node scripts/certification/verify-r14-browser.mjs
