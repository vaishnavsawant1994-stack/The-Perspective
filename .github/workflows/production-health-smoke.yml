name: Production Health Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Create an assigned test incident after healthy endpoint checks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-health-smoke
  cancel-in-progress: false

jobs:
  health:
    name: Check public production health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PERSPECTIVE_PRODUCTION_ORIGIN: https://www.thetimesofperspective.com
      PERSPECTIVE_TEST_ALERT: ${{ inputs.test_alert }}
    steps:
      - name: Check liveness, database readiness and public response
        shell: bash
        run: |
          set -euo pipefail

          origin="${PERSPECTIVE_PRODUCTION_ORIGIN%/}"

          for path in /api/health/live /api/health/ready /; do
            status="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$origin${path}")"
            printf '%s %s\n' "$status" "$path"
            if [[ "$status" != "200" ]]; then
              echo "Production health check failed for ${path}." >&2
              exit 1
            fi
          done

          if [[ "${PERSPECTIVE_TEST_ALERT:-false}" == "true" ]]; then
            echo "Requested test alert after successful production endpoint checks." >&2
            exit 1
          fi

  alert:
    name: Notify owner about a production incident
    if: ${{ always() && needs.health.result == 'failure' }}
    needs: health
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Create or update the assigned production incident
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Production health check failed";
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );
            const body = [
              "The hourly production health check failed.",
              "",
              "- Site: https://www.thetimesofperspective.com",
              `- Workflow run: ${runUrl}`,
              `- Trigger: ${context.eventName}`,
              "",
              "This incident will close automatically after a later healthy check.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing incident #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: ["vaishnavsawant1994-stack"],
              });
              core.info(`Created and assigned incident #${created.data.number}.`);
            }

  recovery:
    name: Close the production incident after recovery
    if: ${{ always() && needs.health.result == 'success' }}
    needs: health
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Close any open production incident
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Production health check failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: "A later scheduled production health check passed all configured endpoints. Closing this incident as recovered.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
              });
              core.info(`Closed recovered incident #${incident.number}.`);
            }
