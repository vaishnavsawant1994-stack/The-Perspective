name: R7 Implementation Qualification

on:
  push:
    branches:
      - phase4/r7-g0-commercial-finance-freeze-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_r7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_r7"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r7
      SHADOW_DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r7_shadow
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://localhost:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma
        run: |
          npm run db:validate
          npm run db:generate

      - name: Create isolated shadow database
        run: psql postgresql://perspective:perspective@localhost:5432/postgres -c "CREATE DATABASE perspective_r7_shadow"

      - name: Apply R2-R7 migrations
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:status

      - name: Run unit tests
        run: npm test

      - name: Seed deterministic inherited fixtures
        env:
          PERSPECTIVE_ALLOW_DEMO_SEED: "true"
        run: |
          npm run db:seed
          npm run db:seed:assert

      - name: Run R7 finance live test
        run: |
          set +e
          npx vitest run --reporter=verbose --config vitest.database.config.mts src/modules/r7/r7-finance.database.test.ts > /tmp/r7-finance-vitest.log 2>&1
          TEST_EXIT=$?
          echo "===== VITEST ISOLATED FINANCE OUTPUT ====="
          cat /tmp/r7-finance-vitest.log
          exit "$TEST_EXIT"

      - name: Run live PostgreSQL tests
        run: |
          set +e
          npx vitest run --reporter=verbose --config vitest.database.config.mts > /tmp/r7-full-db-vitest.log 2>&1
          TEST_EXIT=$?
          echo "===== VITEST FULL DB OUTPUT ====="
          cat /tmp/r7-full-db-vitest.log
          exit "$TEST_EXIT"

      - name: Upload Vitest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-vitest-logs-${{ github.sha }}
          path: |
            /tmp/r7-finance-vitest.log
            /tmp/r7-full-db-vitest.log
          if-no-files-found: warn

      - name: Print first Vitest failure
        if: failure()
        run: |
          echo "===== FIRST VITEST FAILURE ====="
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/r7-full-db-vitest.log")
          if not p.exists():
              print("missing /tmp/r7-full-db-vitest.log")
              raise SystemExit(0)
          text = p.read_text(errors="replace")
          markers = ["FAIL  ", "AssertionError", "Error:", "✖ "]
          idx = min((text.find(m) for m in markers if text.find(m) >= 0), default=-1)
          if idx < 0:
              print(text[-4000:])
          else:
              print(text[max(0, idx - 400): idx + 2500])
          PY
