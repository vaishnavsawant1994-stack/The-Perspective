name: R7 Implementation Qualification

on:
  push:
    branches:
      - phase4/r7-g0-commercial-finance-freeze-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_r7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_r7"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r7
      SHADOW_DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r7_shadow
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://localhost:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma
        run: |
          npm run db:validate
          npm run db:generate

      - name: Create isolated shadow database
        run: psql postgresql://perspective:perspective@localhost:5432/postgres -c "CREATE DATABASE perspective_r7_shadow"

      - name: Apply R2-R7 migrations
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:status

      - name: Run unit tests
        run: npm test

      - name: Seed deterministic inherited fixtures
        env:
          PERSPECTIVE_ALLOW_DEMO_SEED: "true"
        run: |
          npm run db:seed
          npm run db:seed:assert

      - name: Run R7 finance live test
        run: npx vitest run --config vitest.database.config.mts src/modules/r7/r7-finance.database.test.ts

      - name: Run live PostgreSQL tests
        run: npm run test:db
