name: R4 Browser Qualification

on:
  push:
    branches:
      - phase4/r4-tenancy-isolation-20260926
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: r4-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspective_r4_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspective_r4_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://perspective:perspective@localhost:5432/perspective_r4_browser
      PERSPECTIVE_AUTH_BOUNDARY_MODE: sessions
      PERSPECTIVE_PUBLIC_APP_ORIGIN: http://127.0.0.1:3100
      PERSPECTIVE_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PERSPECTIVE_AUTH_KEY_VERSION: "1"
      PERSPECTIVE_AUTH_TEST_BASE_URL: http://127.0.0.1:3100
      PERSPECTIVE_R4_BROWSER_EMAIL: r4-multi-client@example.test
      PERSPECTIVE_R4_BROWSER_PASSWORD: R4 Browser Multi Organization Passphrase 2026!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare R4 database and fixture
        run: |
          npm run db:generate
          npm run db:migrate:deploy
          PERSPECTIVE_ALLOW_AUTH_FIXTURE=true npx tsx scripts/authentication/create-r4-browser-fixture.ts

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3100 > /tmp/r4-browser-server.log 2>&1 &
          echo $! > /tmp/r4-browser-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/client/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/r4-browser-server.log
          exit 1

      - name: Run Chromium tenancy review
        run: node scripts/authentication/verify-r4-browser.mjs

      - name: Upload R4 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-browser-evidence
          path: |
            artifacts/r4-browser
            /tmp/r4-browser-server.log
          if-no-files-found: warn
          retention-days: 14
