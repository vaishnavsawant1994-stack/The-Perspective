name: V1 Dependency Lock Refresh

on:
  push:
    branches:
      - phase4/v1-finalization-20261010
    paths:
      - package.json
      - .github/workflows/v1-dependency-refresh.yml

permissions:
  contents: write

concurrency:
  group: v1-dependency-lock-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@v4
        with:
          ref: phase4/v1-finalization-20261010
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from pinned dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency posture
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v1): refresh secure dependency lockfile"
          git push origin HEAD:phase4/v1-finalization-20261010
