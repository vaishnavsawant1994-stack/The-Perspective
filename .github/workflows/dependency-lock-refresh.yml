name: Dependency Lock Refresh

on:
  push:
    branches:
      - review/r3-auth-contract-repair-20260926

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Generate patched dependency manifest and lockfile
        run: |
          npm pkg set dependencies.next=16.3.6
          npm pkg set overrides.mysql2=3.24.4
          npm pkg set overrides.sharp=0.35.4
          npm install --package-lock-only --ignore-scripts

      - name: Verify patched production dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): patch current production advisories"
          git push origin HEAD:${GITHUB_REF_NAME}
